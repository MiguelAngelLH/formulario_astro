name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure base/site
        env:
          REPO: ${{ github.repository }}
        run: |
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo "$REPO" | cut -d'/' -f2)
          echo "SITE=https://$OWNER.github.io/$NAME" >> $GITHUB_ENV
          echo "BASE_PATH=/$NAME/" >> $GITHUB_ENV

      - name: Build
        run: npm run build
        env:
          SITE: ${{ env.SITE }}
          BASE_PATH: ${{ env.BASE_PATH }}
          # Variables de MailerSend si usas endpoint interno (no recomendado en Pages)
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
          MAILERSEND_FROM_EMAIL: ${{ secrets.MAILERSEND_FROM_EMAIL }}
          MAILERSEND_FROM_NAME: ${{ secrets.MAILERSEND_FROM_NAME }}
          MAILERSEND_TO_EMAIL: ${{ secrets.MAILERSEND_TO_EMAIL }}
          # Si usas un endpoint externo para contacto:
          PUBLIC_CONTACT_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_ENDPOINT }}

      - name: Disable internal API for static Pages
        if: ${{ !!secrets.PUBLIC_CONTACT_ENDPOINT }}
        run: |
          echo "PUBLIC_CONTACT_ENDPOINT is set. Disabling internal API route for static build."
          mv src/pages/api/contact.ts src/pages/api/contact.ts.disabled

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
